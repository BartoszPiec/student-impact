name: MVP E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Preview or production URL to test"
        required: true
        type: string
      target:
        description: "Readiness target"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: mvp-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ inputs.base_url || vars.E2E_BASE_URL }}
      STRIPE_WEBHOOK_PROCESS_INLINE: "true"
      STRIPE_PAYOUTS_ENABLED: "true"
      VERCEL_ENV: "preview"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E Scenarios
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || vars.E2E_BASE_URL != '' }}
    env:
      E2E_BASE_URL: ${{ inputs.base_url || vars.E2E_BASE_URL }}
      NEXT_PUBLIC_APP_URL: ${{ inputs.base_url || vars.E2E_BASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      TEST_COMPANY_EMAIL: ${{ secrets.TEST_COMPANY_EMAIL }}
      TEST_COMPANY_PASSWORD: ${{ secrets.TEST_COMPANY_PASSWORD }}
      TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
      TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
      STRIPE_WEBHOOK_PROCESS_INLINE: ${{ inputs.target == 'production' && 'false' || 'true' }}
      STRIPE_PAYOUTS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Readiness gate
        run: npm run check:${{ inputs.target || 'preview' }}

      - name: MVP scenario suite
        run: npm run test:mvp-scenarios -- --base-url="$E2E_BASE_URL"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp-e2e-report
          path: test-results/
